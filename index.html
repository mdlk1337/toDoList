<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My toDolist</title>
</head>
<body>
    <div class="toDolist__wrapper">
        <div class="toDoList__createTask">
            <input class="task__input" type="text" placeholder="Введите вашу задачу"/>
            <button class="toDolist__btn">Добавить задачу</button>
        </div>
        <div class="toDoList__btns">
            <button class="btn theAll__btn">Все</button>
            <button class="btn completed__btn">Выполненые</button>
            <button class="btn notCompleted__btn">Не выполненые</button>
        </div>
    </div>
    <div class="toggle__btns">
        <button class="toggle__btn markAll__btn">Отметить все</button>
        <button class="toggle__btn removeAll__btn">Убрать все</button>
    </div>
    <div class="wrapper__task">
        
    </div>
        <script src="script.js"></script>
</body>
</html>
