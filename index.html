<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My toDolist</title>
</head>
<body>
    <div class="toDolist__wrapper">
        <div class="toDolist">
            <input class="task_input" type="text" placeholder="Введите вашу задачу"/>
            <button class="toDolist__btn">Добавить задачу</button>
        </div>
        <div class="btns">
            <button class="btn1">Все</button>
            <button class="btn2">Выполненые</button>
            <button class="btn3">Не выполненые</button>
        </div>
    </div>
    <div class="allToggle">
        <button class="addCheckboxAll">Отметить все</button>
        <button class="deleteCheckbox">Убрать все</button>
    </div>
    <div class="wrapper__task">
        
    </div>
        <script src="script.js"></script>
</body>
</html>
