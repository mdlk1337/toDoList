<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My toDolist</title>
</head>
<body>
    <div class="todo-app">
    <h1>Todo List</h1>

    <div class="todo-input">
        <input
            type="text"
            class="task-input"
            placeholder="Добавить задачу..."
        />
        <button class="add-btn">+</button>
    </div>

    <div class="filters">
        <button class="filter-btn theAll__btn  active" data-filter="all">
            Все
        </button>

        <button class="filter-btn completed__btn" data-filter="completed">
            Выполненные
        </button>

        <button class="filter-btn active__btn" data-filter="active">
            Активные
        </button>
    </div>

    <div class="counter-tasks">
        <span class="counter-task">Количество тасок:</span>
        <span class="counter-number"></span>
    </div>

    <div class="tasks">

        <div class="task">
            <label class="task-content">
                <input type="checkbox">
                <span>Изучить React Hooks</span>
            </label>

            <div class="task-actions">
                <button class="edit-btn">✏️</button>
                <button class="delete-btn">🗑️</button>
            </div>
        </div>

        <div class="task completed">
            <label class="task-content">
                <input type="checkbox" checked>
                <span>Сделать тренировку</span>
            </label>

            <div class="task-actions">
                <button class="edit-btn">✏️</button>
                <button class="delete-btn">🗑️</button>
            </div>
        </div>   
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
